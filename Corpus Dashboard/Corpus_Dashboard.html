<title>Delta-Z Corpus Dashboard</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ground:#F7F6F2; --surface:#FFFFFF; --surface-2:#EFEDE6; --border:#DEDBD1;
    --ink:#1B1F24; --ink-muted:#5B6470; --ink-faint:#8C93A0;
    --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-weak:#E1F2F1;
    --warm:#C6631F; --warm-weak:#F7E9DC;
    --pos:#1E7A4C; --pos-weak:#E4F3EA; --neg:#B23A3A; --neg-weak:#FBEAE9;
    --shadow-1: 0 1px 2px rgba(20,20,20,.06), 0 1px 1px rgba(20,20,20,.04);
    --shadow-2: 0 4px 14px rgba(20,20,20,.08), 0 1px 3px rgba(20,20,20,.06);
    --radius: 8px;
    --mono: "Cascadia Mono","Consolas","SFMono-Regular",ui-monospace,Menlo,monospace;
    --sans: "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  :root[data-theme="dark"]{
    --ground:#0E1116; --surface:#161B22; --surface-2:#1C232C; --border:#2A323D;
    --ink:#E8EAED; --ink-muted:#98A2B0; --ink-faint:#6C7583;
    --accent:#3DD6C4; --accent-ink:#06201D; --accent-weak:rgba(61,214,196,.14);
    --warm:#E8925A; --warm-weak:rgba(232,146,90,.14);
    --pos:#4FBE85; --pos-weak:rgba(79,190,133,.14); --neg:#E27575; --neg-weak:rgba(226,117,117,.14);
    --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 6px 20px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--sans); font-weight:600; margin:0; text-wrap:balance;}
  a{color:var(--accent);}
  code,.mono{font-family:var(--mono);}
  button{font-family:inherit; font-size:inherit; cursor:pointer;}
  ::selection{background:var(--accent-weak);}

  #shell{max-width:1440px; margin:0 auto; padding:0 20px 48px;}

  header.top{
    position:sticky; top:0; z-index:30; background:var(--ground);
    padding:18px 20px 12px; margin:0 -20px; border-bottom:1px solid var(--border);
  }
  .brand-row{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--accent);
    border:1px solid var(--accent); border-radius:4px; padding:2px 6px;
  }
  .brand h1{font-size:19px;}
  .brand .sub{color:var(--ink-muted); font-size:12.5px;}
  .top-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    background:var(--surface); border:1px solid var(--border); border-radius:7px;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-muted);
  }
  .icon-btn:hover{color:var(--ink); border-color:var(--ink-faint);}

  .kpis{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:8px 14px; min-width:100px;
  }
  .kpi .n{font-family:var(--mono); font-size:19px; font-weight:600; font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  nav.tabs{display:flex; gap:2px; margin-top:14px; border-bottom:1px solid var(--border);}
  .tab{
    background:none; border:none; padding:9px 14px; font-size:13.5px; font-weight:600;
    color:var(--ink-muted); border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab:hover{color:var(--ink);}
  .tab[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent);}

  .filterbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:10px 0; margin-top:2px;
  }
  .fgroup{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .fgroup .flabel{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-right:2px;}
  .chip{
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:4px 10px; font-size:12px; color:var(--ink-muted); display:inline-flex; align-items:center; gap:5px;
  }
  .chip .sw{width:8px; height:8px; border-radius:2px; flex:none;}
  .chip[aria-pressed="true"]{border-color:var(--accent); color:var(--ink); background:var(--accent-weak);}
  .chip:hover{border-color:var(--ink-faint);}
  input[type="number"], input[type="search"]{
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:5px 8px; color:var(--ink); font-size:12.5px; font-family:var(--sans);
  }
  input[type="number"]{width:64px; font-family:var(--mono); font-variant-numeric:tabular-nums;}
  input[type="search"]{width:220px;}
  .yearsep{color:var(--ink-faint); font-size:12px;}
  .reset-link{background:none;border:none;color:var(--ink-muted);font-size:12px;text-decoration:underline;text-underline-offset:2px;}
  .reset-link:hover{color:var(--ink);}

  main{padding-top:18px;}
  .view{display:none;}
  .view.active{display:block;}

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow-1);
  }
  .grid2{display:grid; grid-template-columns:1.15fr .85fr; gap:16px;}
  .grid3{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:900px){ .grid2{grid-template-columns:1fr;} .grid3{grid-template-columns:repeat(2,1fr);} }

  .panel h2{font-size:14px; margin-bottom:2px;}
  .panel .desc{font-size:12px; color:var(--ink-muted); margin-bottom:14px; max-width:62ch;}

  .stat-card{
    background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:12px;
  }
  .stat-card .n{font-family:var(--mono); font-size:22px; font-weight:600;}
  .stat-card .l{font-size:12px; color:var(--ink-muted); margin-top:3px;}

  .bar-row{display:flex; align-items:center; gap:10px; margin:7px 0;}
  .bar-row .lbl{width:220px; font-size:12px; color:var(--ink-muted); flex:none; text-align:right;}
  .bar-track{flex:1; background:var(--surface-2); border-radius:4px; height:14px; overflow:hidden; display:flex;}
  .bar-fill{height:100%;}
  .bar-row .val{width:34px; font-family:var(--mono); font-size:11.5px; color:var(--ink-muted); text-align:right;}

  svg text{font-family:var(--sans); fill:var(--ink);}
  svg .muted{fill:var(--ink-muted);}
  .axis-line{stroke:var(--border); stroke-width:1;}
  .tick-line{stroke:var(--border); stroke-width:1; opacity:.55;}
  .quad-line{stroke:var(--ink-faint); stroke-width:1; stroke-dasharray:3 3;}

  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-muted); margin-top:10px; align-items:center;}
  .legend .li{display:inline-flex; align-items:center; gap:5px;}
  .legend .sw{width:9px; height:9px; border-radius:2px;}
  .legend .ln{width:16px; height:2px;}
  .legend svg{flex:none;}
  .legend-sep{width:1px; align-self:stretch; background:var(--border); margin:0 2px;}

  .dot, .shape{cursor:pointer;}
  .dot:hover, .dot.focus, .shape:hover, .shape.focus{stroke:var(--ink) !important; stroke-width:1.5px;}
  .dim{opacity:.16;}
  .hcell{cursor:pointer;}
  .hcell:hover{stroke:var(--ink); stroke-width:1.5;}
  .arc{cursor:pointer; fill:none;}
  .arc:hover{opacity:1 !important; stroke-width:3.5px !important;}
  .netnode{cursor:pointer;}
  .netnode:hover .nlabel, .netnode.focus .nlabel{fill:var(--ink); font-weight:600;}
  .netnode:hover circle, .netnode.focus circle{stroke:var(--ink); stroke-width:1.5px;}

  table{border-collapse:collapse; width:100%; font-size:12.5px;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-faint); border-bottom:1px solid var(--border); padding:6px 10px; cursor:pointer;
    white-space:nowrap; position:sticky; top:0; background:var(--surface);
  }
  thead th:hover{color:var(--ink);}
  thead th .arrow{opacity:.5; margin-left:3px;}
  tbody td{padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  tbody tr.rowmain{cursor:pointer;}
  tbody tr.rowmain:hover{background:var(--surface-2);}
  tbody tr.rowdetail{background:var(--surface-2); display:none;}
  tbody tr.rowdetail.open{display:table-row;}
  tbody tr.rowdetail td{padding:12px 14px;}
  .refcell{max-width:420px;}
  .refcell .ref{display:block;}
  .idbadge{font-family:var(--mono); font-size:11px; color:var(--ink-muted);}
  .codechip{
    font-family:var(--mono); font-size:10.5px; background:var(--accent-weak); color:var(--accent);
    border-radius:4px; padding:1px 5px; margin:1px 2px 1px 0; display:inline-block; cursor:pointer;
    border:1px solid transparent;
  }
  .codechip:hover{border-color:var(--accent);}
  .tablewrap{max-height:640px; overflow:auto; border:1px solid var(--border); border-radius:7px;}
  .tablewrap thead th{top:0;}

  .macrobadge{
    font-size:10.5px; padding:2px 7px; border-radius:5px; white-space:nowrap; display:inline-block;
  }
  .quadbadge{
    font-size:10.5px; padding:2px 7px; border-radius:5px; white-space:nowrap; display:inline-block;
    border:1px solid currentColor;
  }

  #tooltip{
    position:fixed; pointer-events:none; z-index:100; background:var(--ink); color:var(--ground);
    font-size:11.5px; padding:6px 9px; border-radius:6px; max-width:280px; line-height:1.4;
    box-shadow:var(--shadow-2); opacity:0; transition:opacity .08s; transform:translate(-50%,-100%);
  }
  :root[data-theme="dark"] #tooltip{background:#E8EAED; color:#0E1116;}
  #tooltip.show{opacity:1;}

  #overlay{
    position:fixed; inset:0; background:rgba(10,10,10,.28); z-index:40; display:none;
  }
  #overlay.show{display:block;}
  #detail{
    position:fixed; top:0; right:0; height:100%; width:420px; max-width:92vw;
    background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-2);
    z-index:41; transform:translateX(100%); transition:transform .18s ease; overflow-y:auto;
  }
  #detail.show{transform:translateX(0);}
  .detail-head{
    padding:16px 18px; border-bottom:1px solid var(--border);
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    position:sticky; top:0; background:var(--surface);
  }
  .detail-body{padding:16px 18px; display:flex; flex-direction:column; gap:18px;}
  .dsection .dtitle{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:7px;}
  .dsection p{margin:0; font-size:13px; color:var(--ink);}
  .aliaslist{display:flex; flex-wrap:wrap; gap:5px;}
  .aliaschip{
    font-size:11px; background:var(--surface-2); border:1px solid var(--border); border-radius:5px;
    padding:2px 7px; color:var(--ink-muted);
  }
  .toplist{display:flex; flex-direction:column; gap:4px;}
  .toprow{display:flex; align-items:center; gap:8px; font-size:12px;}
  .toprow .tname{flex:1; color:var(--ink);}
  .toprow .tbar{height:8px; background:var(--accent); border-radius:2px;}
  .toprow .tcount{font-family:var(--mono); font-size:11px; color:var(--ink-muted); width:16px; text-align:right;}
  .statpair{display:flex; gap:10px;}
  .statpair .sp{flex:1; background:var(--surface-2); border-radius:6px; padding:8px 10px;}
  .statpair .sp .n{font-family:var(--mono); font-size:18px; font-weight:600;}
  .statpair .sp .l{font-size:10.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em;}
  .edgeline{
    display:flex; align-items:center; gap:6px; font-size:12px; padding:5px 0; border-bottom:1px solid var(--border);
  }
  .edgeline:last-child{border-bottom:none;}
  .edgeline .arr{font-family:var(--mono); font-size:11px; color:var(--ink-faint);}
  .edgeline .who{flex:1; cursor:pointer;}
  .edgeline .who:hover{text-decoration:underline; text-decoration-color:var(--accent);}
  .siglink{font-size:12px;}
  .doclist{display:flex; flex-direction:column; gap:6px;}
  .docline{font-size:12px; color:var(--ink-muted); display:flex; gap:6px;}
  .docline .id{font-family:var(--mono); color:var(--accent); flex:none; cursor:pointer;}
  .close-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:6px;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center; color:var(--ink-muted); flex:none;
  }
  .close-btn:hover{color:var(--ink);}

  footer.foot{
    margin-top:32px; padding-top:14px; border-top:1px solid var(--border);
    font-size:11.5px; color:var(--ink-faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  footer.foot code{color:var(--ink-muted);}

  .empty-state{padding:40px 10px; text-align:center; color:var(--ink-muted); font-size:13px;}
  .rationale-box{
    background:var(--surface-2); border-radius:6px; padding:10px 12px; font-size:12px; color:var(--ink-muted);
    margin-top:4px;
  }
  .explain{font-size:12.5px; color:var(--ink-muted); max-width:80ch; margin-bottom:16px;}
  .explain b{color:var(--ink); font-weight:600;}
</style>

<div id="tooltip"></div>
<div id="overlay"></div>
<aside id="detail"></aside>

<div id="shell">
  <header class="top">
    <div class="brand-row">
      <div class="brand">
        <span class="mark">Δz</span>
        <h1>Corpus Dashboard</h1>
        <span class="sub">Documentary</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">◐</button>
      </div>
    </div>

    <div class="kpis" id="kpi-strip"></div>

    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab" data-view="overview" role="tab">Overview</button>

      <button class="tab" data-view="network" role="tab">Relation Network</button>
      <button class="tab" data-view="explorer" role="tab">Corpus Explorer</button>
    </nav>

    <div class="filterbar" id="filterbar"></div>
  </header>

  <main>
    <section class="view" id="view-overview" data-view="overview"></section>
    <section class="view" id="view-structural" data-view="structural"></section>
    <section class="view" id="view-network" data-view="network"></section>
    <section class="view" id="view-explorer" data-view="explorer"></section>
  </main>

  <footer class="foot" id="footer"></footer>
</div>

<script>
(function(){
"use strict";

/* ============================== DATA ============================== */
const DATA = JSON.parse(document.getElementById('corpus-data').textContent);
const VARS = DATA.variables, DOCS = DATA.documents, EVID = DATA.evidence, RELS = DATA.relations, MATRIX = DATA.matrix, META = DATA.meta;

const varByCode = new Map(VARS.map(v=>[v.code,v]));
const docById = new Map(DOCS.map(d=>[d.id,d]));
const evidByDoc = new Map(); EVID.forEach(e=>{ if(!evidByDoc.has(e.doc)) evidByDoc.set(e.doc,[]); evidByDoc.get(e.doc).push(e); });
const evidByVar = new Map(); EVID.forEach(e=>{ if(!evidByVar.has(e.code)) evidByVar.set(e.code,[]); evidByVar.get(e.code).push(e); });
const relsOut = new Map(); const relsIn = new Map();
RELS.forEach(r=>{
  if(!relsOut.has(r.oc)) relsOut.set(r.oc,[]); relsOut.get(r.oc).push(r);
  if(!relsIn.has(r.dc)) relsIn.set(r.dc,[]); relsIn.get(r.dc).push(r);
});

const MACROGROUPS = META.macrogroups; // 3, in G1/G2/G3 order
const MACRO_PALETTE_SOLID_LIGHT=['#2E62A8','#C6631F','#2F8F5B'];
const MACRO_PALETTE_SOLID_DARK=['#6FA6E8','#E8925A','#5FC98A'];
function macroSolid(m){
  const i = MACROGROUPS.indexOf(m);
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  const pal = dark ? MACRO_PALETTE_SOLID_DARK : MACRO_PALETTE_SOLID_LIGHT;
  return i>=0 ? pal[i % pal.length] : (dark?'#6C7583':'#8C93A0');
}
function groupCodeOf(macro){ const i = MACROGROUPS.indexOf(macro); return i>=0? 'G'+(i+1) : ''; }
const QUADRANTS = ['Driving','Relay / unstable','Dependent','Autonomous'];
const QUAD_SHAPE = {'Driving':'triangle','Relay / unstable':'circle','Dependent':'square','Autonomous':'diamond'};
function quadColor(q){
  return q==='Driving' ? 'var(--pos)' : q==='Dependent' ? 'var(--neg)' : q==='Relay / unstable' ? 'var(--warm)' : 'var(--ink-faint)';
}

const YEAR_MIN = META.yearRange[0], YEAR_MAX = META.yearRange[1];

/* ============================== STATE ============================== */
const State = {
  view: 'overview',
  macro: new Set(MACROGROUPS),
  quad: new Set(QUADRANTS),
  sign: new Set(['+','-']),
  yearMin: YEAR_MIN, yearMax: YEAR_MAX,
  search: '',
  focusVar: null,
  focusDoc: null,
};

function encodeHash(){
  const p = new URLSearchParams();
  p.set('view', State.view);
  if(State.macro.size < MACROGROUPS.length) p.set('macro', [...State.macro].map(m=>MACROGROUPS.indexOf(m)).join(','));
  if(State.quad.size < QUADRANTS.length) p.set('quad', [...State.quad].map(q=>QUADRANTS.indexOf(q)).join(','));
  if(State.sign.size < 2) p.set('sign', [...State.sign].join(','));
  if(State.yearMin!==YEAR_MIN) p.set('y0', State.yearMin);
  if(State.yearMax!==YEAR_MAX) p.set('y1', State.yearMax);
  if(State.search) p.set('q', State.search);
  if(State.focusVar) p.set('var', State.focusVar);
  if(State.focusDoc) p.set('doc', State.focusDoc);
  history.replaceState(null,'', '#'+p.toString());
}
function decodeHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  if(p.has('view')) State.view = p.get('view');
  if(p.has('macro')) State.macro = new Set(p.get('macro').split(',').map(i=>MACROGROUPS[+i]).filter(Boolean));
  if(p.has('quad')) State.quad = new Set(p.get('quad').split(',').map(i=>QUADRANTS[+i]).filter(Boolean));
  if(p.has('sign')) State.sign = new Set(p.get('sign').split(','));
  if(p.has('y0')) State.yearMin = +p.get('y0');
  if(p.has('y1')) State.yearMax = +p.get('y1');
  if(p.has('q')) State.search = p.get('q');
  if(p.has('var')) State.focusVar = p.get('var');
  if(p.has('doc')) State.focusDoc = p.get('doc');
}

function setState(patch){
  Object.assign(State, patch);
  encodeHash();
  render();
}

/* ============================== FILTER LOGIC ============================== */
function matchesSearch(text){
  if(!State.search) return true;
  return (text||'').toLowerCase().includes(State.search.toLowerCase());
}
function filteredVars(){
  return VARS.filter(v => State.macro.has(v.macro) && State.quad.has(v.quad));
}
function filteredDocs(){
  return DOCS.filter(d=>{
    if(d.year < State.yearMin || d.year > State.yearMax) return false;
    const macroName = d.macro.replace(/^[GE]\d\s/,'');
    if(macroName !== 'no counted variable' && !State.macro.has(macroName)) return false;
    if(!matchesSearch(d.ref + ' ' + d.topic)) return false;
    return true;
  });
}
function filteredRels(){
  const varSet = new Set(filteredVars().map(v=>v.code));
  return RELS.filter(r=>{
    if(!State.sign.has(r.sign)) return false;
    if(!varSet.has(r.oc) && !varSet.has(r.dc)) return false;
    return true;
  });
}

/* ============================== HELPERS ============================== */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function docLink(d){
  const url = d.url || (d.doi ? 'https://doi.org/'+d.doi : '');
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(d.ref)}</a>` : esc(d.ref);
}
function macroBadge(name){
  const c = macroSolid(name);
  return `<span class="macrobadge" style="background:color-mix(in srgb, ${c} 16%, transparent); color:${c};">${esc(name)}</span>`;
}
function quadBadge(q){
  return `<span class="quadbadge" style="color:${quadColor(q)};">${esc(q)}</span>`;
}
function showTooltip(evt, html){
  const t = document.getElementById('tooltip');
  t.innerHTML = html;
  t.style.left = evt.clientX + 'px';
  t.style.top = (evt.clientY - 10) + 'px';
  t.classList.add('show');
}
function hideTooltip(){ document.getElementById('tooltip').classList.remove('show'); }

/* shape path generator for structural-class markers (triangle/square/diamond); circle handled natively */
function shapePath(type, cx, cy, r){
  if(type==='triangle'){
    const h = r*1.28;
    return `M ${cx} ${(cy-h).toFixed(1)} L ${(cx-h*0.97).toFixed(1)} ${(cy+h*0.72).toFixed(1)} L ${(cx+h*0.97).toFixed(1)} ${(cy+h*0.72).toFixed(1)} Z`;
  }
  if(type==='square'){
    const s = r*0.86;
    return `M ${(cx-s).toFixed(1)} ${(cy-s).toFixed(1)} L ${(cx+s).toFixed(1)} ${(cy-s).toFixed(1)} L ${(cx+s).toFixed(1)} ${(cy+s).toFixed(1)} L ${(cx-s).toFixed(1)} ${(cy+s).toFixed(1)} Z`;
  }
  if(type==='diamond'){
    const d = r*1.22;
    return `M ${cx} ${(cy-d).toFixed(1)} L ${(cx+d).toFixed(1)} ${cy} L ${cx} ${(cy+d).toFixed(1)} L ${(cx-d).toFixed(1)} ${cy} Z`;
  }
  return null;
}
function markerSvg(cls, dataAttr, cx, cy, r, fill, extraClass){
  const shape = QUAD_SHAPE[cls];
  const common = `class="dot ${extraClass||''}" ${dataAttr} fill="${fill}" fill-opacity="0.85" stroke="${fill}"`;
  if(shape==='circle') return `<circle ${common} cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}"></circle>`;
  return `<path ${common} d="${shapePath(shape, cx, cy, r)}"></path>`;
}

/* ============================== VIEW: STRUCTURAL MAP ============================== */
function deriveThreshold(vs, getter, lowClasses, highClasses){
  const lowVals = vs.filter(v=>lowClasses.includes(v.quad)).map(getter);
  const highVals = vs.filter(v=>highClasses.includes(v.quad)).map(getter);
  if(!lowVals.length || !highVals.length) return (Math.max(...vs.map(getter))+Math.min(...vs.map(getter)))/2;
  return (Math.max(...lowVals) + Math.min(...highVals)) / 2;
}

function renderStructural(){
  const el = document.getElementById('view-structural');
  const allVs = VARS;
  const activeCodes = new Set(filteredVars().map(v=>v.code));

  const W=520,H=420,PAD=46;
  const maxInflData = Math.max(...allVs.map(v=>v.infl));
  const maxDepData = Math.max(...allVs.map(v=>v.dep));
  const maxInfl = Math.ceil((maxInflData+0.5)); // headroom to next integer
  const maxDep = Math.ceil((maxDepData+0.5));
  const inflThreshold = deriveThreshold(allVs, v=>v.infl, ['Autonomous','Dependent'], ['Driving','Relay / unstable']);
  const depThreshold  = deriveThreshold(allVs, v=>v.dep,  ['Driving','Autonomous'],   ['Relay / unstable','Dependent']);
  const maxFreq = Math.max(...allVs.map(v=>v.freq),1);
  const xScale = d => PAD + (d/maxDep)*(W-2*PAD);
  const yScale = i => H-PAD - (i/maxInfl)*(H-2*PAD);
  const rScale = f => 5.5 + 8.5*Math.sqrt(f/maxFreq);

  // collision handling: points sharing the exact same (infl,dep) get a small symmetric x-nudge and alternating label offsets
  const byCoord = new Map();
  allVs.forEach(v=>{ const k=v.infl+','+v.dep; if(!byCoord.has(k)) byCoord.set(k,[]); byCoord.get(k).push(v); });
  const nudgeOf = new Map(); const labelAboveOf = new Map();
  byCoord.forEach(group=>{
    const n = group.length;
    group.forEach((v,idx)=>{
      const offset = n>1 ? (idx-(n-1)/2)*13 : 0;
      nudgeOf.set(v.code, offset);
      labelAboveOf.set(v.code, n>1 ? (idx%2===0) : true);
    });
  });

  // integer tick marks
  const xTicks=[]; for(let d=0; d<=maxDep; d++) xTicks.push(d);
  const yTicks=[]; for(let i=0; i<=maxInfl; i++) yTicks.push(i);

  const gridLines = [
    ...xTicks.map(d=>`<line class="tick-line" x1="${xScale(d).toFixed(1)}" y1="${PAD}" x2="${xScale(d).toFixed(1)}" y2="${H-PAD}"></line>`),
    ...yTicks.map(i=>`<line class="tick-line" x1="${PAD}" y1="${yScale(i).toFixed(1)}" x2="${W-PAD}" y2="${yScale(i).toFixed(1)}"></line>`)
  ].join('');
  const tickLabels = [
    ...xTicks.map(d=>`<text class="muted" x="${xScale(d).toFixed(1)}" y="${H-PAD+16}" font-size="9" text-anchor="middle" font-family="var(--mono)">${d}</text>`),
    ...yTicks.map(i=>`<text class="muted" x="${PAD-9}" y="${(yScale(i)+3).toFixed(1)}" font-size="9" text-anchor="end" font-family="var(--mono)">${i}</text>`)
  ].join('');

  const points = allVs.map(v=>{
    const dim = !activeCodes.has(v.code);
    const foc = State.focusVar===v.code;
    const cx = xScale(v.dep) + (nudgeOf.get(v.code)||0);
    const cy = yScale(v.infl);
    return markerSvg(v.quad, `data-var="${v.code}"`, cx, cy, rScale(v.freq), macroSolid(v.macro), (foc?'focus ':'')+(dim?'dim':''));
  }).join('');
  const labels = allVs.map(v=>{
    const dim = !activeCodes.has(v.code);
    const cx = xScale(v.dep) + (nudgeOf.get(v.code)||0);
    const r = rScale(v.freq);
    const above = labelAboveOf.get(v.code);
    const cy = yScale(v.infl) + (above? -(r+6) : (r+13));
    return `<text class="muted ${dim?'dim':''}" x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" font-size="10" text-anchor="middle" font-family="var(--mono)">${v.code}</text>`;
  }).join('');

  const scatterSvg = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="420" id="scatter-svg">
      ${gridLines}
      <line class="axis-line" x1="${PAD}" y1="${H-PAD}" x2="${W-PAD}" y2="${H-PAD}"></line>
      <line class="axis-line" x1="${PAD}" y1="${PAD}" x2="${PAD}" y2="${H-PAD}"></line>
      <line class="quad-line" x1="${xScale(depThreshold).toFixed(1)}" y1="${PAD}" x2="${xScale(depThreshold).toFixed(1)}" y2="${H-PAD}"></line>
      <line class="quad-line" x1="${PAD}" y1="${yScale(inflThreshold).toFixed(1)}" x2="${W-PAD}" y2="${yScale(inflThreshold).toFixed(1)}"></line>
      ${tickLabels}
      <text class="muted" x="${(W/2)}" y="${H-6}" font-size="11" text-anchor="middle">Dependence score (incoming coupling)</text>
      <text class="muted" x="14" y="${H/2}" font-size="11" text-anchor="middle" transform="rotate(-90,14,${H/2})">Influence score (outgoing coupling)</text>
      ${points}${labels}
    </svg>`;

  el.innerHTML = `
    <div class="grid2">
      <div class="panel">
        <h2>Influence vs. dependence</h2>
        <div class="desc">Each marker is a variable (V01–V14): color = functional group, shape = structural class, area = net corpus frequency. Dashed lines mark the influence/dependence thresholds implied by the manuscript's own class assignments.</div>
        ${scatterSvg}
        <div class="legend">
          ${MACROGROUPS.map(m=>`<span class="li"><span class="sw" style="background:${macroSolid(m)}"></span>${groupCodeOf(m)} ${esc(m)}</span>`).join('')}
          <span class="legend-sep"></span>
          <span class="li"><svg width="11" height="11"><path d="M5.5 0 L11 9.5 L0 9.5 Z" fill="var(--ink-muted)"></path></svg>Driving</span>
          <span class="li"><svg width="11" height="11"><circle cx="5.5" cy="5.5" r="5" fill="var(--ink-muted)"></circle></svg>Relay/unstable</span>
          <span class="li"><svg width="11" height="11"><rect width="9" height="9" x="1" y="1" fill="var(--ink-muted)"></rect></svg>Dependent</span>
          <span class="li"><svg width="11" height="11"><path d="M5.5 0 L11 5.5 L5.5 11 L0 5.5 Z" fill="var(--ink-muted)"></path></svg>Autonomous</span>
        </div>
      </div>
      <div class="panel">
        <h2>Coupling matrix (MICMAC)</h2>
        <div class="desc">Row = origin variable, column = destination variable. Intensity = coded coupling value (0–3). Click a cell to open its relations.</div>
        <div style="display:grid; grid-template-columns:28px repeat(14,1fr); gap:2px; font-family:var(--mono); font-size:9px;">
          <div></div>
          ${MATRIX.vars.map(c=>`<div class="muted" style="text-align:center;">${c.slice(1)}</div>`).join('')}
          ${MATRIX.vars.map((rc,ri)=>`
            <div class="muted" style="align-self:center;">${rc}</div>
            ${MATRIX.vars.map((cc,ci)=>{
              const val = MATRIX.data[ri][ci]; const dim = !activeCodes.has(rc) || !activeCodes.has(cc);
              const op = val===0? 0.04 : 0.22+0.26*val;
              return `<div class="hcell" data-mrow="${rc}" data-mcol="${cc}" data-mval="${val}"
                style="aspect-ratio:1; border-radius:2px; background:color-mix(in srgb, var(--accent) ${Math.round(op*100)}%, var(--surface)); opacity:${dim?0.15:1};"></div>`;
            }).join('')}
          `).join('')}
        </div>
      </div>
    </div>
  `;

  el.querySelectorAll('[data-var]').forEach(n=>{
    n.addEventListener('click', ()=>openDetail(n.dataset.var));
    n.addEventListener('mousemove', e=>{
      const v = varByCode.get(n.dataset.var);
      showTooltip(e, `<b>${v.code}</b> · ${esc(v.term)}<br>Influence ${v.infl} · Dependence ${v.dep}<br>${esc(v.quad)}`);
    });
    n.addEventListener('mouseleave', hideTooltip);
  });
  el.querySelectorAll('[data-mrow]').forEach(c=>{
    c.addEventListener('mousemove', e=>{
      const r=c.dataset.mrow, col=c.dataset.mcol, val=c.dataset.mval;
      showTooltip(e, `${r} → ${col}: <b>${val}</b>`);
    });
    c.addEventListener('mouseleave', hideTooltip);
    c.addEventListener('click', ()=>{
      if(c.dataset.mval==='0') return;
      setState({view:'network', focusVar:c.dataset.mrow});
    });
  });
}

/* ============================== VIEW: RELATION NETWORK (arc diagram) ============================== */
function renderNetwork(){
  const el = document.getElementById('view-network');
  const vs = [...VARS].sort((a,b)=> MACROGROUPS.indexOf(a.macro)-MACROGROUPS.indexOf(b.macro) || a.code.localeCompare(b.code));
  const activeCodes = new Set(filteredVars().map(v=>v.code));
  const rels = filteredRels();

  const W = Math.max(760, vs.length*70), H = 420, baseY = H-60, PAD=40;
  const xFor = code => PAD + (vs.findIndex(v=>v.code===code))*((W-2*PAD)/(vs.length-1));

  const nodes = vs.map(v=>{
    const dim = !activeCodes.has(v.code);
    const foc = State.focusVar===v.code;
    const x = xFor(v.code);
    return `<g class="netnode ${foc?'focus':''} ${dim?'dim':''}" data-var="${v.code}">
      <circle cx="${x.toFixed(1)}" cy="${baseY}" r="7" fill="${macroSolid(v.macro)}" stroke="${macroSolid(v.macro)}"></circle>
      <text class="nlabel muted" x="${x.toFixed(1)}" y="${baseY+22}" font-size="10" text-anchor="middle" font-family="var(--mono)">${v.code}</text>
    </g>`;
  }).join('');

  const arcs = rels.map((r,i)=>{
    const x1 = xFor(r.oc), x2 = xFor(r.dc);
    const dist = Math.abs(x2-x1);
    const midY = baseY - Math.max(24, Math.min(dist*0.62, baseY-30));
    const color = r.sign==='+' ? 'var(--pos)' : 'var(--neg)';
    const sw = r.strength===3 ? 2.6 : 1.6;
    const foc = State.focusVar && (r.oc===State.focusVar || r.dc===State.focusVar);
    const dimmed = !activeCodes.has(r.oc) || !activeCodes.has(r.dc) || (State.focusVar && !foc);
    return `<path class="arc" data-idx="${i}" d="M ${x1.toFixed(1)} ${baseY} Q ${((x1+x2)/2).toFixed(1)} ${midY.toFixed(1)} ${x2.toFixed(1)} ${baseY}"
      stroke="${color}" stroke-width="${sw}" opacity="${dimmed?0.08:0.55}"></path>`;
  }).join('');

  el.innerHTML = `
    <div class="panel">
      <h2>Network of coded relations</h2>
      <div class="desc">Each arc is a directed origin→destination relation extracted from a corpus document. Color = sign, thickness = strength. Click an arc to see its evidence; click a node to isolate its relations.</div>
      <div style="overflow-x:auto;">
        <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:${W}px;">
          ${arcs}${nodes}
        </svg>
      </div>
      <div class="legend">
        <span class="li"><span class="ln" style="background:var(--pos)"></span>Positive relation</span>
        <span class="li"><span class="ln" style="background:var(--neg)"></span>Negative relation</span>
        <span class="li">Arc thickness = coded strength (2–3)</span>
        ${State.focusVar ? `<button class="reset-link" id="clear-focus">Clear focus on ${State.focusVar}</button>` : ''}
      </div>
    </div>
  `;

  el.querySelectorAll('[data-var]').forEach(n=>{
    n.addEventListener('click', ()=>setState({focusVar: State.focusVar===n.dataset.var? null : n.dataset.var}));
  });
  el.querySelectorAll('[data-idx]').forEach(p=>{
    const r = rels[+p.dataset.idx];
    p.addEventListener('mousemove', e=>showTooltip(e, `<b>${r.oc}</b> → <b>${r.dc}</b> (${r.sign}${r.strength})<br>${esc(r.ov)} → ${esc(r.dv)}`));
    p.addEventListener('mouseleave', hideTooltip);
    p.addEventListener('click', ()=>openRelation(r));
  });
  const clr = document.getElementById('clear-focus');
  if(clr) clr.addEventListener('click', ()=>setState({focusVar:null}));
}

        <table>
          <thead><tr>
            ${cols.map(([k,l])=>`<th data-sort="${k}">${l}${sortKey===k?`<span class="arrow">${sortDir>0?'↑':'↓'}</span>`:''}</th>`).join('')}
            <th>Coded variables</th>
          </tr></thead>
          <tbody>
            ${ds.map(d=>`
              <tr class="rowmain" data-doc="${d.id}">
                <td class="idbadge">${d.id}</td>
                <td class="mono">${d.year}</td>
                <td class="refcell"><span class="ref">${docLink(d)}</span></td>
                <td>${esc(d.topic)}</td>
                <td>${macroBadge(d.macro.replace(/^[GE]\d\s/,''))}</td>
                <td class="mono">${d.nvar}</td>
                <td>${d.codes.map(c=>`<span class="codechip" data-code="${c}">${c}</span>`).join('')}</td>
              </tr>
              <tr class="rowdetail ${openRow===d.id?'open':''}" data-detail="${d.id}"><td colspan="7"></td></tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  el.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click', ()=>{
    const k = th.dataset.sort;
    if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir = (k==='year'||k==='nvar')? -1 : 1; }
    renderExplorer();
  }));
  el.querySelectorAll('.rowmain').forEach(tr=>tr.addEventListener('click', e=>{
    if(e.target.closest('.codechip') || e.target.closest('a')) return;
    const id = tr.dataset.doc;
    openRow = openRow===id? null : id;
    renderExplorer();
    if(openRow){
      const dr = el.querySelector(`[data-detail="${openRow}"] td`);
      const d = docById.get(id);
      const ev = evidByDoc.get(id) || [];
      dr.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div><b>Rationale for inclusion:</b> ${esc(d.rationale)}</div>
          <div><b>Support scope:</b> ${esc(d.scope)}</div>
          <div><b>Use in manuscript:</b> ${esc(d.use)}</div>
          ${ev.length? `<div><b>Evidence by variable:</b>
            ${ev.map(e=>`<div class="rationale-box"><span class="codechip" data-code="${e.code}">${e.code}</span> ${esc(e.name)} — local names: <i>${esc(e.local)}</i></div>`).join('')}
          </div>` : ''}
        </div>`;
      dr.closest('tr').querySelectorAll('.codechip').forEach(c=>c.addEventListener('click', ev=>{ev.stopPropagation(); openDetail(c.dataset.code);}));
    }
  }));
  el.querySelectorAll('.codechip').forEach(c=>c.addEventListener('click', e=>{e.stopPropagation(); openDetail(c.dataset.code);}));
}

/* ============================== DETAIL PANEL ============================== */
function openDetail(code){
  setState({focusVar: code, view: State.view==='overview'? 'structural': State.view});
}
function renderDetailPanel(){
  const panel = document.getElementById('detail');
  const overlay = document.getElementById('overlay');
  if(!State.focusVar){ panel.classList.remove('show'); overlay.classList.remove('show'); return; }
  const v = varByCode.get(State.focusVar);
  if(!v){ panel.classList.remove('show'); overlay.classList.remove('show'); return; }
  overlay.classList.add('show'); panel.classList.add('show');

  const outR = (relsOut.get(v.code)||[]);
  const inR = (relsIn.get(v.code)||[]);
  const maxTop = Math.max(1,...v.top.map(t=>t.c||0));

  panel.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="mono" style="font-size:11px; color:var(--ink-faint); margin-bottom:2px;">${v.code}</div>
        <h3 style="font-size:16px;">${esc(v.term)}</h3>
        <div style="display:flex; gap:6px; margin-top:6px;">${macroBadge(v.macro)}${quadBadge(v.quad)}</div>
      </div>
      <button class="close-btn" id="detail-close">✕</button>
    </div>
    <div class="detail-body">
      <div class="dsection">
        <div class="dtitle">Definition</div>
        <p>${esc(v.def)}</p>
      </div>
      <div class="dsection">
        <div class="dtitle">Structural position</div>
        <div class="statpair">
          <div class="sp"><div class="n">${v.infl}</div><div class="l">Influence</div></div>
          <div class="sp"><div class="n">${v.dep}</div><div class="l">Dependence</div></div>
          <div class="sp"><div class="n">${v.freq}</div><div class="l">Net frequency</div></div>
        </div>
      </div>
      <div class="dsection">
        <div class="dtitle">Most frequent local names</div>
        <div class="toplist">
          ${v.top.slice(0,10).map(t=>`
            <div class="toprow">
              <div class="tname">${esc(t.n)}</div>
              <div class="tbar" style="width:${t.c? Math.max(6,60*t.c/maxTop):6}px;"></div>
              <div class="tcount">${t.c ?? ''}</div>
            </div>`).join('')}
        </div>
      </div>
      <div class="dsection">
        <div class="dtitle">Alias / local-name dictionary (${v.alias.length})</div>
        <div class="aliaslist">${v.alias.map(a=>`<span class="aliaschip">${esc(a)}</span>`).join('')}</div>
      </div>
      <div class="dsection">
        <div class="dtitle">Outgoing relations (${outR.length})</div>
        ${outR.length? outR.map(r=>`
          <div class="edgeline">
            <span class="arr" style="color:${r.sign==='+'?'var(--pos)':'var(--neg)'}">${r.sign}${r.strength}</span>
            <span class="who" data-code="${r.dc}">→ ${r.dc} ${esc(r.dv)}</span>
          </div>`).join('') : '<p style="color:var(--ink-muted); font-size:12px;">None in the filtered corpus.</p>'}
      </div>
      <div class="dsection">
        <div class="dtitle">Incoming relations (${inR.length})</div>
        ${inR.length? inR.map(r=>`
          <div class="edgeline">
            <span class="arr" style="color:${r.sign==='+'?'var(--pos)':'var(--neg)'}">${r.sign}${r.strength}</span>
            <span class="who" data-code="${r.oc}">← ${r.oc} ${esc(r.ov)}</span>
          </div>`).join('') : '<p style="color:var(--ink-muted); font-size:12px;">None in the filtered corpus.</p>'}
      </div>
      <div class="dsection">
        <div class="dtitle">Supporting documents (${v.docs.length})</div>
        <div class="doclist">
          ${v.docs.map(id=>{ const d=docById.get(id); return d? `<div class="docline"><span class="id" data-doc="${id}">${id}</span> ${docLink(d)}</div>` : '';}).join('')}
        </div>
      </div>
    </div>
  `;
  panel.querySelector('#detail-close').addEventListener('click', ()=>setState({focusVar:null}));
  panel.querySelectorAll('.who').forEach(w=>w.addEventListener('click', ()=>openDetail(w.dataset.code)));
  panel.querySelectorAll('.id[data-doc]').forEach(w=>w.addEventListener('click', ()=>{
    setState({view:'explorer', focusVar:null});
    openRow = w.dataset.doc; renderExplorer();
    setTimeout(()=>{ const row = document.querySelector(`[data-doc="${w.dataset.doc}"]`); if(row) row.scrollIntoView({block:'center'}); },0);
  }));
  overlay.onclick = ()=>setState({focusVar:null});
}
function openRelation(r){
  const overlay = document.getElementById('overlay'); const panel = document.getElementById('detail');
  overlay.classList.add('show'); panel.classList.add('show');
  panel.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="mono" style="font-size:11px; color:var(--ink-faint); margin-bottom:2px;">Coded relation</div>
        <h3 style="font-size:15px;">${r.oc} → ${r.dc}</h3>
      </div>
      <button class="close-btn" id="detail-close">✕</button>
    </div>
    <div class="detail-body">
      <div class="dsection"><div class="dtitle">Origin</div><p><span class="codechip" data-code="${r.oc}">${r.oc}</span> ${esc(r.ov)} — <i>${esc(r.orole)}</i></p></div>
      <div class="dsection"><div class="dtitle">Destination</div><p><span class="codechip" data-code="${r.dc}">${r.dc}</span> ${esc(r.dv)} — <i>${esc(r.drole)}</i></p></div>
      <div class="dsection">
        <div class="dtitle">Sign / strength / contribution</div>
        <div class="statpair">
          <div class="sp"><div class="n" style="color:${r.sign==='+'?'var(--pos)':'var(--neg)'}">${r.sign}</div><div class="l">Sign</div></div>
          <div class="sp"><div class="n">${r.strength}</div><div class="l">Strength</div></div>
          <div class="sp"><div class="n">${r.signed}</div><div class="l">Signed contrib.</div></div>
        </div>
      </div>
      <div class="dsection"><div class="dtitle">Rationale</div><p>${esc(r.rationale)}</p></div>
      <div class="dsection"><div class="dtitle">Source document</div><p class="mono" style="font-size:11px; color:var(--ink-faint);">${r.doc}</p><p>${r.url? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.ref)}</a>` : esc(r.ref)}</p></div>
    </div>
  `;
  panel.querySelector('#detail-close').addEventListener('click', ()=>setState({focusVar:null}));
  panel.querySelectorAll('[data-code]').forEach(c=>c.addEventListener('click', ()=>openDetail(c.dataset.code)));
  overlay.onclick = ()=>setState({focusVar:null});
}

/* ============================== MAIN RENDER ============================== */
function render(){
  renderKpis();
  renderTabs();
  renderFilterbar();
  renderFooter();
  if(State.view==='overview') renderOverview();
  else if(State.view==='structural') renderStructural();
  else if(State.view==='network') renderNetwork();
  else if(State.view==='explorer') renderExplorer();
  renderDetailPanel();
}

/* ============================== INIT ============================== */
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click', ()=>setState({view:btn.dataset.view})));

const themeBtn = document.getElementById('theme-toggle');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('deltaz-theme', t); }catch(e){}
  render();
}
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='dark' ? 'light' : 'dark');
});
// Always opens in light mode by default, regardless of any previously saved preference;
// the toggle button still switches to dark for the current view.
document.documentElement.setAttribute('data-theme', 'light');

window.addEventListener('hashchange', ()=>{ decodeHash(); render(); });

decodeHash();
render();

})();
</script>
