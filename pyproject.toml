[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltaz-aif"
version = "1.0.0"
description = "Computational reconstruction of DeltaZ: EDOF & Axial Sampling Densification study"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Carlos Mario Garzón", email = "cmgarzono@unal.edu.co"}
]
keywords = ["EDOF", "focus-stacking", "axial-sampling", "3D-imaging", "computational-imaging"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.17",
    "matplotlib>=3.9",
    "pandas>=3.0",
    "scikit-image>=0.24",
    "Pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/cmgarzono/DeltaZ_AIF"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
